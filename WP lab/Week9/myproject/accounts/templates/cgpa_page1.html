<!DOCTYPE html>
<html>
<head>
    <title>CGPA Calculator - Page 1</title>
</head>
<body>

<h2>Page 1</h2>

<hr>
<a href="{% url 'home' %}">Redirect to Home</a>
</body>
</html>
