<!DOCTYPE html>
<html>
<head>
    <title>Book Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        img {
            width: 180px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        a {
            display: block;
            padding: 12px;
            margin: 8px 0;
            background-color: #2c3e50;
            color: #ffffff;
            border-radius: 6px;
            font-size: 16px;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        a:hover {
            background-color: #1abc9c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>The Great Book</h1>

    <img src="https://via.placeholder.com/200x300" alt="Book Cover">

    <a href="{% url 'metadata' %}">📘 Metadata</a>
    <a href="{% url 'reviews' %}">⭐ Reviews</a>
    <a href="{% url 'publisher' %}">🏢 Publisher Info</a>
</div>

</body>
</html>
